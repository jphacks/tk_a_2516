steps:
  # Dockerイメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/chaplin-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/chaplin-backend:latest',
      '.'
    ]
    dir: 'chaplin'

  # イメージをContainer Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chaplin-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chaplin-backend:latest']

  # Cloud Runにデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'chaplin-backend',
      '--image', 'gcr.io/$PROJECT_ID/chaplin-backend:$COMMIT_SHA',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--memory', '2Gi',
      '--cpu', '2',
      '--max-instances', '10',
      '--port', '8080',
      '--allow-unauthenticated'
    ]

images:
  - 'gcr.io/$PROJECT_ID/chaplin-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/chaplin-backend:latest'
